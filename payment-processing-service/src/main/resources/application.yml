server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: payment-processing-service
  datasource:
    url: ${PROCESSING_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${PROCESSING_DB_USERNAME:}
    password: ${PROCESSING_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${PROCESSING_DDL_AUTO:update}
    open-in-view: false
simulation:
  allow-mode-change: ${SIMULATION_ALLOW_MODE_CHANGE:true}
