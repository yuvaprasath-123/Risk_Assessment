server:
  port: ${SERVER_PORT:8089}
spring:
  application:
    name: approval-workflow-service
  datasource:
    url: ${APPROVAL_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${APPROVAL_DB_USERNAME:}
    password: ${APPROVAL_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${APPROVAL_DDL_AUTO:update}
    open-in-view: false
approval:
  default-sla-minutes: ${APPROVAL_DEFAULT_SLA_MINUTES:60}
  outbox:
    enabled: true
    interval-ms: 5000
integration:
  security-url: ${SECURITY_SERVICE_URL:http://localhost:8081}
