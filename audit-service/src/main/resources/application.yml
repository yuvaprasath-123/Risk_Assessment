server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${AUDIT_DB_USERNAME:}
    password: ${AUDIT_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${AUDIT_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
